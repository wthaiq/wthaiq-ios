name: WthaiqSigningDemo
options:
  bundleIdPrefix: com.wthaiq.demo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  WthaiqSigning:
    path: ../..

targets:
  WthaiqSigningDemo:
    type: application
    platform: iOS
    sources:
      - path: WthaiqSigningDemo
    dependencies:
      - package: WthaiqSigning
    info:
      path: WthaiqSigningDemo/Info.plist
      properties:
        CFBundleDisplayName: Wthaiq Signing
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "The camera is used to photograph your ID and to confirm your identity while signing."
        NSMicrophoneUsageDescription: "The microphone may be used during identity verification while signing."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wthaiq.demo.signing
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
